<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹게임 라운지 · WebPlay</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f141b; --bg2:#171d25; --panel:#1b2838; --panel2:#213246;
  --line:#2a3f5a; --text:#c7d5e0; --muted:#8193a5; --white:#ffffff;
  --accent:#66c0f4; --pos:#66c0f4; --mix:#b9a074; --neg:#c35c2c; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}

/* 헤더 */
header{position:sticky;top:0;z-index:50;background:rgba(23,29,37,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;color:var(--white);letter-spacing:-.5px}
.logo-mark{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),#1b4f7a);display:grid;place-items:center;font-size:16px}
.nav-links{display:flex;gap:18px;font-size:14px;font-weight:500}
.nav-links a{color:var(--muted);transition:.2s}
.nav-links a:hover,.nav-links a.on{color:var(--white)}
.search{margin-left:auto;position:relative;flex:0 1 300px}
.search input{width:100%;padding:9px 14px 9px 36px;border-radius:6px;border:1px solid var(--line);background:#0e1620;color:var(--white);font-size:14px;outline:none}
.search input:focus{border-color:var(--accent)}
.search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.7}
.wish-btn{background:var(--panel2);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;white-space:nowrap}
.wish-btn b{color:var(--accent)}

main{max-width:1240px;margin:0 auto;padding:24px 16px 60px}

/* ===== 썸네일 미디어 레이어 =====
   z-index: 0 이모지(대체) → 1 실제 이미지 → 2 그라데이션 오버레이 → 3 배지/버튼 */
.media{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.media .fallback{position:relative;z-index:0;transition:opacity .3s}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s,transform .4s;z-index:1}
.media img.loaded{opacity:1}
.media img.contain{object-fit:contain;padding:18%;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.media.has-img .fallback{opacity:0}
.media.loading::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);
  background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.card:hover .media img.loaded:not(.contain){transform:scale(1.05)}

/* 히어로 */
.hero{display:grid;grid-template-columns:1.6fr 1fr;border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:0 10px 40px rgba(0,0,0,.4);margin-bottom:12px;min-height:360px}
.hero-art{position:relative;overflow:hidden;font-size:120px}
.hero-art::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,transparent 65%,var(--panel))}
.hero-info{padding:28px;display:flex;flex-direction:column;gap:12px}
.hero-info .label{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px}
.hero-info h2{font-size:28px;color:var(--white);line-height:1.2}
.hero-info p{font-size:14px}
.hero-dots{display:flex;justify-content:center;gap:8px;margin-bottom:36px}
.hero-dots button{width:14px;height:8px;border-radius:4px;background:var(--panel2);transition:.3s}
.hero-dots button.on{background:var(--accent);width:28px}

/* 섹션/필터 */
.section-title{display:flex;align-items:end;justify-content:space-between;margin:8px 0 14px;gap:12px;flex-wrap:wrap}
.section-title h3{font-size:15px;font-weight:700;color:var(--white)}
.section-title span{font-size:13px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:20px;background:var(--panel);color:var(--text);font-size:13px;border:1px solid transparent;transition:.2s}
.chip:hover{border-color:var(--line)}
.chip.on{background:var(--accent);color:#0b1a28;font-weight:700}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:7px 10px;border-radius:6px;font-family:inherit;font-size:13px}
.toolbar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--panel);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;cursor:pointer;border:1px solid transparent}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.45);border-color:var(--line)}
.thumb{position:relative;aspect-ratio:1.91/1;font-size:60px}
.thumb::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 35%,transparent 70%,rgba(27,40,56,.6) 100%)}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:3}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;background:rgba(0,0,0,.65);color:#fff}
.badge.vibe{background:linear-gradient(90deg,#ff5f9e,#a259ff)}
.badge.kr{background:#c4302b}
.heart{position:absolute;top:8px;right:10px;z-index:3;background:rgba(0,0,0,.55);width:32px;height:32px;border-radius:50%;font-size:15px;display:grid;place-items:center}
.card-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-body h4{font-size:16px;color:var(--white)}
.card-body .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.card-body .desc{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;background:rgba(103,193,245,.12);color:var(--accent);padding:2px 8px;border-radius:3px}
.review{font-size:12px;display:flex;justify-content:space-between;gap:8px}
.review .lbl{font-weight:700}
.bar{height:5px;background:#0e1620;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.scale div{font-size:11px;color:var(--muted);text-align:center}
.scale b{display:block;color:var(--white);font-size:12px;font-weight:500}
.play{display:block;text-align:center;padding:10px;font-weight:700;font-size:14px;color:#d2efa9;background:linear-gradient(90deg,#75b022,#588a1b);border-radius:6px;transition:.2s}
.play:hover{background:linear-gradient(90deg,#8ed629,#6aa621);color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--bg2);border-radius:12px;max-width:760px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--line);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-art{position:relative;aspect-ratio:1.91/1;max-height:340px;width:100%;font-size:96px}
.modal-art::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,transparent 60%,var(--bg2))}
.close{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px}
.modal-content{padding:24px;display:grid;grid-template-columns:1.5fr 1fr;gap:24px}
.modal-content h2{color:var(--white);font-size:24px}
.modal-content .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.modal-content p{font-size:14px;margin-bottom:14px}
.side{background:var(--panel);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:13px;height:fit-content}
.side .row{display:flex;justify-content:space-between;gap:10px}
.side .row span:first-child{color:var(--muted)}
.side .row span:last-child{color:var(--white);text-align:right}
.react-box{background:var(--panel);border-radius:8px;padding:14px;margin-bottom:14px}
.react-box h5{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:12px}
.pros-cons ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.pros li::before{content:"👍 "} .cons li::before{content:"👎 "}
.note{font-size:11px;color:var(--muted);margin-top:8px}

footer{border-top:1px solid var(--line);padding:24px 16px;text-align:center;font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .hero-art{aspect-ratio:1.91/1;font-size:90px}
  .hero-art::after{background:linear-gradient(180deg,transparent 60%,var(--panel))}
  .nav-links{display:none}
  .modal-content{grid-template-columns:1fr}
  .pros-cons{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="#"><div class="logo-mark">🎮</div>WebPlay</a>
    <nav class="nav-links">
      <a href="#" class="on">스토어</a>
      <a href="#list">전체 게임</a>
      <a href="#list" onclick="setGenre('바이브코딩')">바이브코딩</a>
    </nav>
    <div class="search"><input id="q" type="text" placeholder="게임 이름, 태그 검색"></div>
    <button class="wish-btn" onclick="toggleWishOnly()">❤ 찜 <b id="wishCount">0</b></button>
  </div>
</header>

<main>
  <section class="hero" id="hero"></section>
  <div class="hero-dots" id="dots"></div>

  <div class="section-title" id="list">
    <h3>전체 웹게임 둘러보기</h3>

  </div>
  <div class="filters" id="genres"></div>
  <div class="toolbar">
    <select id="sort">

      <option value="light">용량 가벼운 순</option>
      <option value="new">최신 순</option>
      <option value="name">이름 순</option>
    </select>
    <label><input type="checkbox" id="mobileOnly"> 모바일 지원만</label>
    <label><input type="checkbox" id="multiOnly"> 멀티플레이만</label>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  WebPlay는 무료로 즐길 수 있는 웹게임을 모아 소개하는 큐레이션 페이지입니다. 썸네일은 각 게임 공식 페이지가 공유용으로 제공하는 대표 이미지이며, 모든 권리는 각 개발자에게 있습니다.<br>
  용량·플레이 시간·유저 반응은 대략적인 참고용 수치입니다.
</footer>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

/* =========================================================
   대표 썸네일 로더
   1) g.thumb 직접 지정  2) 공식 페이지 og:image (메타데이터 API)
   3) 사이트 로고/파비콘  4) 이모지 대체 썸네일
   결과는 7일간 브라우저에 캐시
   ========================================================= */
const THUMB_KEY = "webplay_thumbs_v1", THUMB_TTL = 7*24*60*60*1000;
let thumbStore = {};
try{ thumbStore = JSON.parse(localStorage.getItem(THUMB_KEY)||"{}"); }catch(e){}
const saveThumbs = ()=>{ try{ localStorage.setItem(THUMB_KEY, JSON.stringify(thumbStore)); }catch(e){} };
const pending = {};
const queue = []; let active = 0; const MAX_CONCURRENT = 3;

function runQueue(){
  while(active < MAX_CONCURRENT && queue.length){
    const job = queue.shift(); active++;
    job().finally(()=>{ active--; runQueue(); });
  }
}
function fetchMeta(g){
  return new Promise(resolve=>{
    queue.push(async ()=>{
      try{
        const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(g.url)}`);
        const json = await res.json();
        const d = (json && json.data) || {};
        if(d.image && d.image.url) resolve({src:d.image.url, fit:"cover"});
        else if(d.logo && d.logo.url) resolve({src:d.logo.url, fit:"contain"});
        else resolve(null);
      }catch(e){ resolve(null); }
    });
    runQueue();
  });
}
function getThumb(g){
  if(g.thumb) return Promise.resolve({src:g.thumb, fit:"cover"});
  const c = thumbStore[g.id];
  if(c && c.url===g.url && Date.now()-c.ts < THUMB_TTL) return Promise.resolve(c.data);
  if(!pending[g.id]){
    pending[g.id] = fetchMeta(g).then(data=>{
      if(data){ thumbStore[g.id] = {data, ts:Date.now(), url:g.url}; saveThumbs(); }
      else delete pending[g.id];       // 실패 시 다음에 재시도
      return data;
    });
  }
  return pending[g.id];
}
const faviconOf = g => `https://www.google.com/s2/favicons?domain=${new URL(g.url).hostname}&sz=128`;

function loadMedia(el){
  if(!el || el.dataset.done) return;
  el.dataset.done = "1";
  const g = GAMES.find(x=>x.id==el.dataset.id);
  const img = el.querySelector("img");
  el.classList.add("loading");
  const finish = ()=> el.classList.remove("loading");
  const show = (src, fit, onFail)=>{
    img.className = fit==="contain" ? "contain" : "";
    img.onload = ()=>{ img.classList.add("loaded"); el.classList.add("has-img"); finish(); };
    img.onerror = onFail;
    img.src = src;
  };
  const tryFavicon = ()=> show(faviconOf(g), "contain", ()=>{ img.removeAttribute("src"); finish(); });
  getThumb(g).then(t=>{
    if(t) show(t.src, t.fit, ()=>{ delete thumbStore[g.id]; saveThumbs(); tryFavicon(); });
    else tryFavicon();
  });
}
const mediaHTML = g => `
  <div class="media" data-id="${g.id}">
    <span class="fallback">${g.emoji}</span>
    <img alt="${g.title} 대표 이미지" referrerpolicy="no-referrer" decoding="async">
  </div>`;

// 화면에 보일 때만 불러오기 (요청 수 절약)
const io = "IntersectionObserver" in window
  ? new IntersectionObserver(entries=>entries.forEach(e=>{
      if(e.isIntersecting){ io.unobserve(e.target); loadMedia(e.target); }
    }), {rootMargin:"200px"})
  : null;
function observeMedia(root){
  root.querySelectorAll(".media").forEach(m=> io ? io.observe(m) : loadMedia(m));
}

function reaction(r){
  if(r>=95) return {t:"압도적으로 긍정적",c:"var(--pos)"};
  if(r>=85) return {t:"매우 긍정적",c:"var(--pos)"};
  if(r>=75) return {t:"대체로 긍정적",c:"var(--pos)"};
  if(r>=40) return {t:"복합적",c:"var(--mix)"};
  return {t:"부정적",c:"var(--neg)"};
}
const fmtSize = mb => mb<1 ? `약 ${Math.round(mb*1000)}KB` : `약 ${mb}MB`;
function fmtTime(m){
  if(m<60) return `${m}분`;
  const h = m/60; return h>=10 ? "10시간+" : `${Math.round(h*10)/10}시간`;
}
function scaleLabel(g){
  const s = g.size + g.time/10;
  return s<5?"초경량":s<20?"가벼움":s<60?"보통":"큰 규모";
}

}
function goHero(i){ heroIdx=i; renderHero(); clearInterval(heroTimer); heroTimer=setInterval(nextHero,6000); }

function renderGenres(){
  document.getElementById("genres").innerHTML = GENRES.map(g=>
    `<button class="chip ${state.genre===g?"on":""}" onclick="setGenre('${g}')">${g==="바이브코딩"?"✨ ":""}${g}</button>`).join("");
}
function setGenre(g){ state.genre=g; state.wishOnly=false; renderGenres(); renderGrid(); }
function toggleWishOnly(){ state.wishOnly=!state.wishOnly; renderGrid(); document.getElementById("list").scrollIntoView({behavior:"smooth"}); }

function filtered(){
  const q = state.q.trim().toLowerCase();
  const list = GAMES.filter(g=>{
    if(state.wishOnly && !wish.has(g.id)) return false;
    if(state.genre!=="전체" && !g.genre.includes(state.genre)) return false;
    if(state.mobile && !g.mobile) return false;
    if(state.multi && !isMulti(g)) return false;
    if(q){
      const hay = [g.title,g.sub,g.dev,g.desc,...g.genre,...g.tags].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const s = {
    rating:(a,b)=>b.rating-a.rating, short:(a,b)=>a.time-b.time,
    light:(a,b)=>a.size-b.size, new:(a,b)=>b.year-a.year, name:(a,b)=>a.title.localeCompare(b.title)
  }[state.sort];
  return list.sort(s);
}

function renderGrid(){
  const list = filtered();
  document.getElementById("countTxt").textContent = state.wishOnly ? `찜한 게임 ${list.length}개` : `${list.length}개의 게임`;
  document.getElementById("wishCount").textContent = wish.size;
  const grid = document.getElementById("grid");
  if(!list.length){ grid.innerHTML = `<div class="empty">조건에 맞는 게임이 없어요 🕹️<br>다른 장르나 검색어를 시도해 보세요.</div>`; return; }
  grid.innerHTML = list.map(g=>{
    const r = reaction(g.rating);
    return `
    <article class="card" onclick="openModal(${g.id})">
      <div class="thumb" style="${art(g)}">
        ${mediaHTML(g)}
        <div class="badges">
          ${g.vibe?'<span class="badge vibe">바이브코딩</span>':""}
          ${g.kr?'<span class="badge kr">한국어</span>':""}
          <span class="badge">${scaleLabel(g)}</span>
        </div>
        <button class="heart" onclick="event.stopPropagation();toggleWish(${g.id})" aria-label="찜하기">${wish.has(g.id)?"❤️":"🤍"}</button>
      </div>
      <div class="card-body">
        <h4>${g.title}</h4>
        <div class="sub">${g.sub} · ${g.year}</div>
        <div class="tags">${g.genre.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        <div class="desc">${g.desc}</div>
        <div class="review"><span>유저 반응</span><span class="lbl" style="color:${r.c}">${r.t}</span></div>
        <div class="bar"><i style="width:${g.rating}%;background:${r.c}"></i></div>
        <div class="scale">
          <div>용량<b>${fmtSize(g.size)}</b></div>
          <div>1회 플레이<b>${fmtTime(g.time)}</b></div>
          <div>모바일<b>${g.mobile?"지원":"PC 권장"}</b></div>
        </div>
        <a class="play" href="${g.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ 플레이</a>
      </div>
    </article>`;
  }).join("");
  observeMedia(grid);
}

function toggleWish(id){
  wish.has(id) ? wish.delete(id) : wish.add(id);
  saveWish(); renderGrid();
  if(document.getElementById("modal").classList.contains("open")) openModal(id);
}

/* ========== 상세 모달 ========== */
function openModal(id){
  const g = GAMES.find(x=>x.id===id), r = reaction(g.rating);
  const box = document.getElementById("modalBox");
  box.innerHTML = `
    <div class="modal-art" style="${art(g)}">${mediaHTML(g)}<button class="close" onclick="closeModal()" aria-label="닫기">✕</button></div>
    <div class="modal-content">
      <div>
        <h2>${g.title}</h2>
        <div class="sub">${g.sub} · 개발: ${g.dev}</div>
        <p>${g.desc}</p>
        <div class="react-box">
          <h5>유저 반응 요약</h5>
          <div class="review"><span class="lbl" style="color:${r.c}">${r.t}</span><span>긍정 ${g.rating}%</span></div>
          <div class="bar" style="margin-top:6px"><i style="width:${g.rating}%;background:${r.c}"></i></div>
          <div class="pros-cons">
            <ul class="pros">${g.pros.map(p=>`<li>${p}</li>`).join("")}</ul>
            <ul class="cons">${g.cons.map(c=>`<li>${c}</li>`).join("")}</ul>
          </div>
          <div class="note">* 커뮤니티 반응을 바탕으로 한 대략적인 요약입니다.</div>
        </div>
        <div class="tags">${[...g.genre,...g.tags].map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
      <aside class="side">
        <div class="row"><span>게임 규모</span><span>${scaleLabel(g)}</span></div>
        <div class="row"><span>예상 용량</span><span>${fmtSize(g.size)}</span></div>
        <div class="row"><span>1회 플레이</span><span>${fmtTime(g.time)}</span></div>
        <div class="row"><span>인원</span><span>${g.players}</span></div>
        <div class="row"><span>모바일</span><span>${g.mobile?"✅ 지원":"❌ PC 권장"}</span></div>
        <div class="row"><span>출시</span><span>${g.year}년</span></div>
        <div class="row"><span>설치</span><span>필요 없음</span></div>
        <a class="play" href="${g.url}" target="_blank" rel="noopener">▶ 지금 플레이</a>
        <button class="wish-btn" onclick="toggleWish(${g.id})">${wish.has(g.id)?"❤️ 찜 해제":"🤍 찜하기"}</button>
      </aside>
    </div>`;
  loadMedia(box.querySelector(".media"));
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); document.body.style.overflow=""; }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* ========== 이벤트 ========== */
document.getElementById("q").addEventListener("input", e=>{ state.q=e.target.value; renderGrid(); });
document.getElementById("sort").addEventListener("change", e=>{ state.sort=e.target.value; renderGrid(); });
document.getElementById("mobileOnly").addEventListener("change", e=>{ state.mobile=e.target.checked; renderGrid(); });
document.getElementById("multiOnly").addEventListener("change", e=>{ state.multi=e.target.checked; renderGrid(); });

renderHero(); heroTimer = setInterval(nextHero, 6000);
renderGenres(); renderGrid();
</script>
</body>
</html>
